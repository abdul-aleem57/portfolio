<!DOCTYPE html>

  <!-- Font Awesome Icons -->

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background 3D Astra Canvas -->
  <canvas id="astra-canvas"></canvas>

  <!-- Navigation Bar -->
  <header class="header">
    <div class="nav-left">
      <a href="#" class="logo">
        <span class="logo-symbol">✦</span>
        <span class="logo-text">Abdul Aleem</span>

    </div>

    <nav class="nav-center">

      <a href="https://github.com/abdul-aleem57" target="_blank" rel="noopener" class="icon-link" title="GitHub">

      </a>
      <a href="https://www.linkedin.com/in/abdul-aleem-5921b925a/" target="_blank" rel="noopener" class="icon-link" title="LinkedIn">

    <div class="hero-title-side title-left">

      <span class="subtitle-tag">Frontend & Creative Dev</span>

    <div class="hero-footer-ribbon">
      <div class="stat-item">
        <span class="stat-number">3+</span>
        <span class="stat-desc">Years Experience</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span class="stat-number">15+</span>

      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span class="stat-number">100%</span>

      </div>
    </div>
